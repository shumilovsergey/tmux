# nanomux — minimal, nano-flavored tmux config.
# Lives in this repo; symlinked to ~/.tmux.conf  (see tools/install.md).
# Shortcuts:  tools/shortcuts.md   |   Scrolling & copy:  tools/scroll-world.md
# Prefix is the backtick  `  — tap it, release, then the next key.

# ── Prefix ──────────────────────────────────────────────
unbind C-b
set -g prefix `
bind ` send-prefix              # tap ` twice to type a real backtick

# ── Comfort (invisible, nothing to learn) ───────────────
set -g mouse on                 # click panes, wheel-scroll, drag to select
set -g history-limit 100000     # keep 100k lines of scrollback
set -g set-clipboard on         # talk to the macOS clipboard
set -g escape-time 10
set -sg repeat-time 600
set -g display-time 2000

# ── Windows: auto-numbered 1, 2, 3 … with no gaps ───────
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g automatic-rename off

# ── Splits (panes) ──────────────────────────────────────
bind '\' split-window -h -c "#{pane_current_path}"   # side-by-side (you: vertical)
bind  -  split-window -v -c "#{pane_current_path}"   # stacked     (you: horizontal)
unbind '"'
unbind %

# move between splits with the arrow keys
bind Left  select-pane -L
bind Down  select-pane -D
bind Up    select-pane -U
bind Right select-pane -R

# `z zoom is built-in — nothing to set.
# close the current split, asks first:
bind x confirm-before -p "close this split? (y/n)" kill-pane

# ── Windows ─────────────────────────────────────────────
bind n new-window -c "#{pane_current_path}"
bind o confirm-before -p "close this window? (y/n)" kill-window
# ` 1 … ` 9  jump to windows 1–9 (built-in).

# ── Scroll / search / copy — the "scroll world" ─────────
setw -g mode-keys emacs         # nano-ish, NOT vim

# enter scroll world:
bind y copy-mode \; send -X page-up          # scroll up (nano Ctrl-Y)
bind v copy-mode \; send -X page-down        # scroll down (nano Ctrl-V)
bind ^ copy-mode \; send -X begin-selection  # start a selection (nano mark)
bind w copy-mode \; command-prompt -p "search:" "send -X search-backward \"%%\""
bind u paste-buffer                          # paste into the terminal (nano Ctrl-U)

# inside scroll world the keys are bare (no backtick):
bind -T copy-mode y     send -X page-up
bind -T copy-mode v     send -X page-down
bind -T copy-mode ^     send -X begin-selection
bind -T copy-mode Space send -X begin-selection
bind -T copy-mode k     send -X copy-pipe-and-cancel "pbcopy"   # copy + leave (nano Ctrl-K)
bind -T copy-mode Enter send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode w     command-prompt -p "search:" "send -X search-backward \"%%\""
bind -T copy-mode q     send -X cancel
# drag with the mouse: copies to the clipboard but KEEPS the highlight and
# your scroll position — press q when you're done reading. (no-clear, not
# and-cancel: -and-cancel is what used to snap you back to the live prompt)
bind -T copy-mode MouseDragEnd1Pane send -X copy-pipe-no-clear "pbcopy"
# double-click = word, triple-click = line — same deal, selection survives
bind -T copy-mode DoubleClick1Pane select-pane \; send -X select-word \; send -X copy-pipe-no-clear "pbcopy"
bind -T copy-mode TripleClick1Pane select-pane \; send -X select-line \; send -X copy-pipe-no-clear "pbcopy"

# trackpad scroll: 2 lines per tick instead of tmux's default 5
bind -T copy-mode WheelUpPane   select-pane \; send -X -N 2 scroll-up
bind -T copy-mode WheelDownPane select-pane \; send -X -N 2 scroll-down

# same double/triple-click, but starting from the live prompt (root table)
bind -T root DoubleClick1Pane select-pane -t = \; if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send -M } { copy-mode ; send -X select-word ; send -X copy-pipe-no-clear "pbcopy" }
bind -T root TripleClick1Pane select-pane -t = \; if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send -M } { copy-mode ; send -X select-line ; send -X copy-pipe-no-clear "pbcopy" }

# ── Reload the config (delivers your edits) ─────────────
bind = source-file ~/.tmux.conf \; display-message "nanomux reloaded"

# ── Minimal dark status bar (easy on the eyes at night) ─
set -g default-terminal "tmux-256color"
set -g status-position bottom
set -g status-style "bg=colour234,fg=colour245"
set -g status-left "#[fg=colour111,bold] nanomux #[fg=colour238]│ "
set -g status-left-length 20
set -g status-right "#{?client_prefix,#[fg=colour216]● ,}#[fg=colour245]%H:%M "
set -g window-status-format         "#[fg=colour245] #I "
set -g window-status-current-format "#[fg=colour234,bg=colour111,bold] #I "
set -g window-status-separator ""
set -g pane-border-style        "fg=colour238"
set -g pane-active-border-style "fg=colour111"
set -g message-style "bg=colour223,fg=colour234,bold"
set -g mode-style    "bg=colour238,fg=colour253,bold"
